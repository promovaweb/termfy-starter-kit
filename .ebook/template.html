<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>$title$</title>
</head>
<body>
  <div class="cover">
    <img class="cover-mark" src="assets/logo.png" alt="Logo">
    <div class="cover-title">
      <div class="cover-kicker">$kicker$</div>
      <h1>Guia do usuário</h1>
      <div class="cover-tagline">$subtitle$</div>
      <div class="cover-desc">$description$</div>
    </div>
    <div class="cover-meta">
      <div>Edição v$version$</div>
      <div>Gerado em $date$</div>
      <div>Fonte editorial: docs/</div>
    </div>
  </div>
  $if(toc)$
  <nav id="TOC" role="doc-toc">$toc$</nav>
  $endif$
  <main>$body$</main>
</body>
</html>
